<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Converter — ToolNest</title><meta name="description" content="Convert text to uppercase, lowercase, title case and sentence case for free."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">T</span> ToolNest</a><nav><a href="index.html#tools">All tools</a><a href="about.html">About</a></nav></header><main class="tool-page"><a class="back" href="index.html">← All tools</a><h1>Text Case Converter</h1><p class="intro">Change the capitalization of your text with one click. Everything happens in your browser.</p><div class="panel"><label for="source">Your text</label><textarea id="source" placeholder="Type or paste text here..."></textarea><div class="row-fields"><button class="action" data-case="upper">UPPERCASE</button><button class="action secondary" data-case="lower">lowercase</button><button class="action secondary" data-case="title">Title Case</button><button class="action secondary" data-case="sentence">Sentence case</button></div><label for="output">Converted text</label><textarea id="output" readonly placeholder="Your converted text will appear here..."></textarea><button class="action secondary" id="copy">Copy result</button><span class="muted" id="status"></span></div></main><script>const src=document.querySelector('#source'),out=document.querySelector('#output');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{let s=src.value,c=b.dataset.case;if(c==='upper')out.value=s.toUpperCase();if(c==='lower')out.value=s.toLowerCase();if(c==='title')out.value=s.toLowerCase().replace(/\\b\\w/g,x=>x.toUpperCase());if(c==='sentence')out.value=s.toLowerCase().replace(/(^\\s*\\w|[.!?]\\s+\\w)/g,x=>x.toUpperCase())});document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(out.value);document.querySelector('#status').textContent='Copied.'};</script></body></html>
